import groovy.json.JsonSlurper

apply plugin: 'com.android.library'
// Provides the `com.facebook.react:react-android` version. The plugin itself comes
// from the consuming app's root build.gradle, which every RN >= 0.71 template has.
apply plugin: 'com.facebook.react'

// Single source of truth for the VLC version: the "vlc" field in package.json.
// Keep in sync with react-native-vlc-media-player.podspec and
// expo/ios/withMobileVlcKit.js, which read the same field.
def packageJson = new JsonSlurper().parseText(file("../package.json").text)
def vlcVersion = packageJson.vlc.android

android {
    namespace 'com.yuanzhou.vlc'
    compileSdk 35

    defaultConfig {
        minSdk 26
        consumerProguardFiles("proguard-rules.pro")
        ndk {
            abiFilters 'armeabi-v7a', 'x86_64', 'arm64-v8a', 'x86'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "org.videolan.android:libvlc-all:${vlcVersion}"
}
